name: Generate sitemap
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sitemap
        uses: cicirello/generate-sitemap@2
        with:
          base-url: https://example.com
      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add sitemap.xml
          git commit -m "auto sitemap" || true
          git push
